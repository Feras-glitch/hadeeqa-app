plugins { id 'com.android.application' }
android {
    namespace 'com.feras.hadeeqa'
    compileSdk 34
    defaultConfig {
        applicationId "com.feras.hadeeqa"
        minSdk 24
        targetSdk 34
        // رقم يزيد مع كل بناء في GitHub Actions، فتُعرف النسخة المثبّتة على كل جهاز
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'duplicate classes with kotlin-stdlib 1.8' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'duplicate classes with kotlin-stdlib 1.8' }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
