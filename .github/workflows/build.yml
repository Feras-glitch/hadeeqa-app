name: Build APK and Windows
on:
  push:
    branches: [main]
    tags: ['trial-*']   # وسم نسخة تجربة ← إصدار ثابت فيه الـAPK وملف ويندوز
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'تخطّي فحوص المتصفح (للطوارئ فقط)'
        type: boolean
        default: false
jobs:
  # فحوص المتصفح كلها قبل أي بناء: إن فشل فحص لا تُبنى نسخة جديدة
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-24.04  # Playwright 1.56 لا يدعم ubuntu-latest (26.04) بعد
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright and Chromium
        run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Browser tests
        run: |
          mkdir -p logs
          pids=""
          for t in full devices hardening round2 round3 round4; do
            python tests/e2e_$t.py > logs/$t.log 2>&1 & pids="$pids $!"
          done
          fail=0
          for p in $pids; do wait $p || fail=1; done
          for t in full devices hardening round2 round3 round4; do
            echo "== $t: $(grep -c '^✓' logs/$t.log) ok, $(grep -c '^✗' logs/$t.log) failed"
            grep -E '^✗|=== (FAILED|ERRORS)|Error' logs/$t.log | head -20 || true
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-logs, path: logs/ }
  android:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        run: sed -i "s/const BUILD='dev';/const BUILD='${{ github.run_number }}-${GITHUB_SHA::7}';/" web/index.html && grep -q "const BUILD='${{ github.run_number }}-" web/index.html
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Copy web app into assets
        run: mkdir -p android/app/src/main/assets/www && cp web/index.html android/app/src/main/assets/www/index.html
      - name: Signing key
        env: { SIGNING: '${{ secrets.ANDROID_SIGNING }}' }
        run: |
          if [ -n "$SIGNING" ]; then
            printf '%s' "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/hadeeqa.jks"
            echo "HADEEQA_KEYSTORE=$RUNNER_TEMP/hadeeqa.jks" >> "$GITHUB_ENV"
            echo "HADEEQA_KEYPASS=${SIGNING%%:*}" >> "$GITHUB_ENV"
          else
            echo "::warning::لا يوجد سرّ ANDROID_SIGNING: نسخة debug يتغيّر توقيعها مع كل بناء، فلا تُثبَّت فوق نسخة سابقة"
          fi
      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$HADEEQA_KEYSTORE" ]; then T=assembleRelease; else T=assembleDebug; fi
          gradle --no-daemon --stacktrace $T 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          mkdir -p out && cp app/build/outputs/apk/*/app-*.apk out/hadeeqa.apk
      - name: Show error tail
        if: failure()
        working-directory: android
        run: grep -nE "error|wrong|Exception|FAIL" build.log | head -40 || true
      - name: Signing certificate (must stay the same between builds)
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs android/out/hadeeqa.apk | grep -E "SHA-256|DN" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: Hadeeqa-android-apk, path: android/out/hadeeqa.apk }
  windows:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        shell: bash
        run: sed -i "s/const BUILD='dev';/const BUILD='${{ github.run_number }}-${GITHUB_SHA::7}';/" web/index.html && grep -q "const BUILD='${{ github.run_number }}-" web/index.html
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Copy web app
        shell: bash
        run: mkdir -p electron/www && cp web/index.html electron/www/index.html
      - name: Install and build
        working-directory: electron
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Hadeeqa-windows, path: electron/dist/*.exe }
  pages:
    needs: test
    if: ${{ !cancelled() && vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        run: sed -i "s/const BUILD='dev';/const BUILD='${{ github.run_number }}-${GITHUB_SHA::7}';/" web/index.html && grep -q "const BUILD='${{ github.run_number }}-" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
  # إصدار ثابت لنسخة التجربة: يُنشأ عند دفع وسم trial-* ويبقى بعد انتهاء صلاحية الـArtifacts
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/trial-') }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "نسخة التجربة $GITHUB_REF_NAME" \
            --notes "نسخة التجربة المجمّدة. ثبّتوا hadeeqa.apk على التابلتات وملف ويندوز على الحاسوب، ولا تحدّثوها حتى نهاية اختبار التذكّر." \
            dist/Hadeeqa-android-apk/hadeeqa.apk dist/Hadeeqa-windows/*.exe
